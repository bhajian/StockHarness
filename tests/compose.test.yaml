services:
  api:
    environment: &test-stores
      ALLOWED_PRIVATE_HOSTS: fixtures,host.docker.internal
      SMTP_TRANSPORT: json
      # Every test file signs in; the suites together exceed the production limit of 20 per ten minutes.
      LOGIN_RATE_LIMIT: 500
      # Dependency triggers (#92) settle for a minute in production; the tests do not wait that long.
      TRANSFORM_TRIGGER_DEBOUNCE_SECONDS: 2
      # Layer 3 research and Layer 5 live nodes do not exist yet; the pipeline tests use stub executors (#156).
      PIPELINE_STUB_EXECUTORS: '1'
      # Dataset syncs call the fixture FMP (#83).
      FMP_BASE_URL: http://fixtures:9090/fmp/stable
  runner:
    environment: *test-stores
  fixtures:
    image: openharness:local
    pull_policy: never
    command: ['node', 'tests/fixtures/server.mjs']
    volumes: ['./tests/fixtures:/app/tests/fixtures:ro']
    ports: ['127.0.0.1:19090:9090']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 10
  # A throwaway MongoDB for the direct-database integration tests (dataset syncs, YAML objects). Part of the
  # isolated test project, so `compose down -v` removes it.
  mongo-direct:
    image: mongo:7.0
    ports: ['127.0.0.1:${TEST_DIRECT_MONGO_PORT:-27119}:27017']
    restart: 'no'
