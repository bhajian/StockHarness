# Backtest, paper broker, and replay configuration (spec §7, docs/replay.md).
# The trusted evaluator (pipeline/strategy, docs/strategies.md) reads the execution, cost, holdout and
# sizing.gross_limit values; the rest are defaults for the paper broker and replay (M6).

# Execution and costs (shared by run_backtest, the paper broker, and replay).
execution_lag_days: 1
commission_bps: 1
slippage_bps: 5
borrow_cost_bps_default: 50 # annualized; used for shorts until real borrow data exists
# What a held name earns when it delists (#448), by a class read from its own last prices
# (pipeline/strategy/delisting.py): a pinned price into the end is a cash-out (merger), a last price under $1
# or a fall of more than half in 60 sessions is distress, anything else is unknown. Shorts never gain.
delisting:
  merger: 0.0
  distress: -0.55
  unknown: -0.30
  short: 0.0
capacity_aum: 100000000 # (unused by the evaluator; see impact.aum and the record's capacity)
# Market impact (#452, pipeline/strategy/costs.py): on top of commission + slippage, a trade pays
# coef × 21-day volatility × √(traded value ÷ 20-day median dollar volume), at a book of `aum`, capped at max_impact.
# The record's `capacity` is the book size at which the median trade reaches max_participation of ADV. Shorts pay
# borrow by market cap: 25 bps (≥ $10B), 50 (≥ $2B), 200 (≥ $300M), 500 (smaller).
impact:
  aum: 10000000
  coef: 1.0
  max_impact: 0.05
  max_participation: 0.1
  vol_days: 21
# Diversification (#465): every book (evaluations and simulations) holds at most max_weight of gross in one name and
# sector_cap in one sector (by the sector on the signal date); the excess stays in cash. Simulations apply the same
# caps to a name's total across ideas. The record's `concentration` shows effective names, the largest name and sector.
evaluation_caps:
  max_weight: 0.10
  sector_cap: 0.30
# Turnover (#466): a held name stays in the book while it ranks within top_n × rank_buffer (new names still come
# from the top top_n), and a simulation doesn't buy a name back for reentry_cooldown_days sessions after a stop or
# an invalidation exit. The record's summary.churn reports holding days, round trips, re-entries and cost drag.
turnover:
  rank_buffer: 1.5
  reentry_cooldown_days: 10

# Holdout lock (spec §5.3). Rules-mode backtests may not touch it.
holdout_months: 18 # the last N months of price history; one shot per theory + code version (#105).
# The API applies it per workspace (evaluator settings) and keeps the boundary fixed once set.

# Factor exposures (#106): long-short top-minus-bottom-third factors from features_ranked, regressed with the
# market (S&P 500) on the strategy's daily returns (Newey-West t-stats). Benchmarks and factors are computed
# when the eligible universe has at most benchmark_max_names names.
factors:
  momentum: mom_12_1_pct
  value: value_score
  quality: quality_score
  low_vol: low_vol_score
benchmark_max_names: 600

# Walk-forward folds (#105): results are recorded per calendar year of the evaluation window.
walk_forward:
  fold: year
  min_days: 20 # shorter (partial) years are reported but marked partial

# Position sizing and portfolio limits (paper broker, docs/replay.md §4b).
sizing:
  kelly_fraction: 0.25 # quarter-Kelly on shrunk edge
  max_weight: 0.05
  sector_cap: 0.30
  gross_limit: 1.00
  net_limit: 1.00

# Historical simulation and agent replay (docs/replay.md).
replay:
  anonymize: true # default true for agent mode; ignored in rules mode
  default_cadence: weekly # weekly first; daily optional
  allow_daily: false
  min_evidence_years: 5 # reports warn when the evidence window is shorter
  evidence_window_floor: '2006-01-01' # minimum backtest start (minus holdout)
  seed: 42 # deterministic replays: same config + seed => identical ledgers
