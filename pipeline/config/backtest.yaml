# Backtest, paper broker, and replay configuration (spec §7, docs/replay.md).
# The trusted evaluator (pipeline/strategy, docs/strategies.md) reads the execution, cost, holdout and
# sizing.gross_limit values; the rest are defaults for the paper broker and replay (M6).

# Execution and costs (shared by run_backtest, the paper broker, and replay).
execution_lag_days: 1
commission_bps: 1
slippage_bps: 5
borrow_cost_bps_default: 50 # annualized; used for shorts until real borrow data exists
delisting_return: -0.30 # applied when a position delists for bankruptcy
capacity_aum: 100000000 # assumed AUM for capacity estimates

# Holdout lock (spec §5.3). Rules-mode backtests may not touch it.
holdout_months: 18 # the last N months of price history; one shot per theory + code version (#105).
# The API applies it per workspace (evaluator settings) and keeps the boundary fixed once set.

# Factor exposures (#106): long-short top-minus-bottom-third factors from features_ranked, regressed with the
# market (S&P 500) on the strategy's daily returns (Newey-West t-stats). Benchmarks and factors are computed
# when the eligible universe has at most benchmark_max_names names.
factors:
  momentum: mom_12_1_pct
  value: value_score
  quality: quality_score
  low_vol: low_vol_score
benchmark_max_names: 600

# Walk-forward folds (#105): results are recorded per calendar year of the evaluation window.
walk_forward:
  fold: year
  min_days: 20 # shorter (partial) years are reported but marked partial

# Position sizing and portfolio limits (paper broker, docs/replay.md §4b).
sizing:
  kelly_fraction: 0.25 # quarter-Kelly on shrunk edge
  max_weight: 0.05
  sector_cap: 0.30
  gross_limit: 1.00
  net_limit: 1.00

# Historical simulation and agent replay (docs/replay.md).
replay:
  anonymize: true # default true for agent mode; ignored in rules mode
  default_cadence: weekly # weekly first; daily optional
  allow_daily: false
  min_evidence_years: 5 # reports warn when the evidence window is shorter
  evidence_window_floor: '2006-01-01' # minimum backtest start (minus holdout)
  seed: 42 # deterministic replays: same config + seed => identical ledgers
