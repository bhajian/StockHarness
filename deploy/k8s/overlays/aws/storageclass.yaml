# Persistent EBS (gp3) for the stateful stores. Retain keeps the underlying EBS
# volume if a claim is deleted, so MongoDB / RabbitMQ / Weaviate data survives.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openharness-gp3
  labels:
    app.kubernetes.io/part-of: openharness
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: 'true'
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
