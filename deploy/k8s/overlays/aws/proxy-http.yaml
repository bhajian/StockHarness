# HTTP router behind the externally managed AWS ALB. The ALB terminates TLS on its
# HTTPS:443 listener and forwards openharness.faberiq.ai to the `openharness` target
# group (instance, NodePort 32020). This Caddy serves one origin: device paths go to
# the gateway, everything else to the Studio/API. TLS lives at the ALB, so there is
# no certificate here; X-Forwarded-Proto is pinned to https because the only public
# listener for this host is HTTPS (port 80 redirects to 443).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openharness-proxy-http
  labels:
    app.kubernetes.io/name: oh-proxy
    app.kubernetes.io/part-of: openharness
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }
    :8080 {
      encode zstd gzip
      @gateway path /connect /mcp/*
      handle @gateway {
        reverse_proxy gateway:8090 {
          header_up X-Forwarded-Proto https
          transport http {
            read_timeout 0
            write_timeout 0
          }
        }
      }
      handle {
        reverse_proxy api:8088 {
          header_up X-Forwarded-Proto https
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: openharness-alb
  labels:
    app.kubernetes.io/name: oh-proxy
    app.kubernetes.io/part-of: openharness
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: oh-proxy
    app.kubernetes.io/part-of: openharness
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 32020
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oh-proxy
  labels:
    app.kubernetes.io/name: oh-proxy
    app.kubernetes.io/part-of: openharness
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oh-proxy
      app.kubernetes.io/part-of: openharness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oh-proxy
        app.kubernetes.io/part-of: openharness
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: proxy
          image: caddy:2.10-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: openharness-proxy-http
        - name: data
          emptyDir: {}
        - name: runtime
          emptyDir: {}
---
# The ALB uses instance targets, so NodePort traffic arrives SNAT'd from node IPs in
# the VPC. Admit that CIDR to the router's port (the base internal-services policy
# only admits in-namespace pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oh-proxy-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oh-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 8080
