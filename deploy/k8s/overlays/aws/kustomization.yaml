# AWS EKS overlay: HTTP ALB ingress + persistent gp3 EBS storage.
# Excludes the Caddy TLS proxy (ALB terminates at L7) and the optional NeMo
# guardrails / Garak evaluation services.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openharness
resources:
  - ../../base
  - storageclass.yaml
  - proxy-http.yaml
images:
  - name: openharness
    newName: 491085405405.dkr.ecr.us-east-1.amazonaws.com/openharness/app
    newTag: dc3aa7616353
  - name: openharness-gateway
    newName: 491085405405.dkr.ecr.us-east-1.amazonaws.com/openharness/gateway
    newTag: c6f90af9dacf
  - name: openharness-mongodb-mcp
    newName: 491085405405.dkr.ecr.us-east-1.amazonaws.com/openharness/mongodb-mcp
    newTag: c6f90af9dacf
  - name: openharness-python-executor
    newName: 491085405405.dkr.ecr.us-east-1.amazonaws.com/openharness/python-executor
    newTag: dc3aa7616353
patches:
  # Drop the Caddy TLS proxy (the ALB replaces it).
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: proxy
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: proxy
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openharness-proxy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: public-proxy
  # Drop the optional NeMo guardrails service.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: guardrails
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: guardrails
  # Drop the optional Garak evaluation service.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: guardrail-evaluation
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: guardrail-evaluation
  # Public origin: the ALB terminates TLS, so the app sees https via X-Forwarded-Proto.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openharness-config
      data:
        PUBLIC_URL: https://openharness.faberiq.ai
        CONFIG_BACKUP_REPO: bhajian/StockHarness
        # Nodes are 2 vCPU and shared; a full-CPU request never schedules. No CPU limit, so Jobs still burst.
        EXECUTOR_JOB_CPU: 500m
        GATEWAY_PUBLIC_URL: wss://openharness.faberiq.ai
        # FMP Premium allows 750 calls/min (#387); dataset syncs take 600 and leave room for agents' FMP calls.
        DATASET_SYNC_RPM: "600"
  # MongoDB memory: 16 GB of data and 1.3 GB of indexes did not fit the 0.54 GB cache a 2 GiB limit gives.
  - target:
      kind: StatefulSet
      name: mongo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 3Gi
          limits:
            memory: 4Gi
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["--wiredTigerCacheSizeGB", "2"]
  # Persistent EBS for the shared files claim and every StatefulSet volume.
  - target:
      kind: PersistentVolumeClaim
      name: files
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: openharness-gp3
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: openharness-gp3
