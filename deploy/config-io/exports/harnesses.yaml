# StockHarness objects (apiVersion stockharness/v1). Import from Settings -> Configuration or the
# object list pages. References are by name; secrets and data rows are never included.
apiVersion: stockharness/v1
kind: Harness
metadata:
  name: Financial Market Analysis
spec:
  description: Give an agent the tools it needs to look up information or take action.
  enabled: true
  startAt: start
  nodes:
    - id: start
      name: Start
      position:
        x: 50
        y: 140
      type: start
      next: assistant
    - id: assistant
      name: Tool assistant
      position:
        x: 340
        y: 110
      type: agent
      config:
        name: Tool assistant
        description: ""
        systemPrompt: Use your attached MCP tools to handle the request. Inspect tool results before answering. Never claim an action succeeded unless its tool result confirms it. Ask for missing information when needed.
        providerId:
          $ref:
            type: providers
            name: Gemini-flash-3-8
        visionProviderId:
          $ref:
            type: providers
            name: Gemini-flash-vision
        connections: []
        knowledgeBaseIds: []
        skillIds:
          - $ref:
              type: skills
              name: stock
        contextCompaction: true
        maxTurns: 12
        timeoutSeconds: 300
        pattern: react
        patternConfig:
          reflections: 1
          iterations: 3
          doneMarker: DONE
          maxPlanSteps: 5
        effort: medium
        enabled: true
      prompt: "{{input}}"
      next: finish
    - id: finish
      name: Finish
      position:
        x: 770
        y: 140
      type: finish
      template: "{{last}}"
  resources:
    - id: mcp_9547656e
      name: FMP
      position:
        x: 438.203125
        y: 357.66015625
      type: mcp
      connectionId:
        $ref:
          type: connections
          name: FMP
      tools:
        - Fundraisers
        - analyst
        - calendar
        - chart
        - commodity
        - company
        - crypto
        - directory
        - discountedCashFlow
        - economics
        - etfAndMutualFunds
        - forex
        - indexes
        - insiderTrades
        - marketHours
        - marketPerformance
        - news
        - quote
        - search
        - secFilings
        - senate
        - statements
        - technicalIndicators
  bindings:
    - agentNodeId: assistant
      resourceId: mcp_9547656e
  maxSteps: 100
  resumePolicy: safe
---
apiVersion: stockharness/v1
kind: Harness
metadata:
  name: Pipeline — Layer 2 (daily)
spec:
  description: Builds the point-in-time Layer 2 collections from raw data. Runs after the daily dataset sync; each node calls pipeline.run() in the executor.
  enabled: true
  startAt: start
  nodes:
    - id: start
      name: Start
      type: start
      next: securities
    - id: securities
      name: Securities
      type: code
      code: |
        import oh
        import pipeline
        try:
            result = pipeline.run('build_securities')
            oh.result(result)
            oh.log('build_securities', result)
            if result.get("status") != "succeeded" or result.get("dq", {}).get("error"):
                raise RuntimeError(f"build_securities failed or had error-severity DQ: {result}")
        except Exception as e:
            import traceback
            oh.log(traceback.format_exc())
            oh.result({"transform": 'build_securities', "status": "failed", "error": str(e)})
            raise
      params: {}
      timeoutSeconds: 3600
      secrets: []
      next: corporate_actions
    - id: corporate_actions
      name: Corporate actions
      type: code
      code: |
        import oh
        import pipeline
        try:
            result = pipeline.run('build_corporate_actions')
            oh.result(result)
            oh.log('build_corporate_actions', result)
            if result.get("status") != "succeeded" or result.get("dq", {}).get("error"):
                raise RuntimeError(f"build_corporate_actions failed or had error-severity DQ: {result}")
        except Exception as e:
            import traceback
            oh.log(traceback.format_exc())
            oh.result({"transform": 'build_corporate_actions', "status": "failed", "error": str(e)})
            raise
      params: {}
      timeoutSeconds: 3600
      secrets: []
      next: prices_daily
    - id: prices_daily
      name: Prices daily
      type: code
      code: |
        import oh
        import pipeline
        try:
            result = pipeline.run('build_prices_daily')
            oh.result(result)
            oh.log('build_prices_daily', result)
            if result.get("status") != "succeeded" or result.get("dq", {}).get("error"):
                raise RuntimeError(f"build_prices_daily failed or had error-severity DQ: {result}")
        except Exception as e:
            import traceback
            oh.log(traceback.format_exc())
            oh.result({"transform": 'build_prices_daily', "status": "failed", "error": str(e)})
            raise
      params: {}
      timeoutSeconds: 3600
      secrets: []
      next: macro_daily
    - id: macro_daily
      name: Macro daily
      type: code
      code: |
        import oh
        import pipeline
        try:
            result = pipeline.run('build_macro_daily')
            oh.result(result)
            oh.log('build_macro_daily', result)
            if result.get("status") != "succeeded" or result.get("dq", {}).get("error"):
                raise RuntimeError(f"build_macro_daily failed or had error-severity DQ: {result}")
        except Exception as e:
            import traceback
            oh.log(traceback.format_exc())
            oh.result({"transform": 'build_macro_daily', "status": "failed", "error": str(e)})
            raise
      params: {}
      timeoutSeconds: 3600
      secrets: []
      next: finish
    - id: finish
      name: Finish
      type: finish
      template: Layer 2 pipeline complete.
  resources: []
  bindings: []
  maxSteps: 100
  resumePolicy: safe
  schedule:
    enabled: true
    everyMinutes: 1440
    input: scheduled layer 2 build
    at: 19:00
    timezone: America/New_York
