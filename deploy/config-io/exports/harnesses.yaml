# StockHarness objects (apiVersion stockharness/v1). Import from Settings -> Configuration or the
# object list pages. References are by name; secrets and data rows are never included.
apiVersion: stockharness/v1
kind: Harness
metadata:
  name: Financial Market Analysis
spec:
  description: Give an agent the tools it needs to look up information or take action.
  enabled: true
  startAt: start
  nodes:
    - id: start
      name: Start
      position:
        x: 50
        y: 140
      type: start
      next: assistant
    - id: assistant
      name: Tool assistant
      position:
        x: 340
        y: 110
      type: agent
      config:
        name: Tool assistant
        description: ""
        systemPrompt: Use your attached MCP tools to handle the request. Inspect tool results before answering. Never claim an action succeeded unless its tool result confirms it. Ask for missing information when needed.
        providerId:
          $ref:
            type: providers
            name: Gemini-flash-3-8
        visionProviderId:
          $ref:
            type: providers
            name: Gemini-flash-vision
        connections: []
        knowledgeBaseIds: []
        skillIds:
          - $ref:
              type: skills
              name: stock
        contextCompaction: true
        maxTurns: 12
        timeoutSeconds: 300
        pattern: react
        patternConfig:
          reflections: 1
          iterations: 3
          doneMarker: DONE
          maxPlanSteps: 5
        effort: medium
        enabled: true
      prompt: "{{input}}"
      next: finish
    - id: finish
      name: Finish
      position:
        x: 770
        y: 140
      type: finish
      template: "{{last}}"
  resources:
    - id: mcp_9547656e
      name: FMP
      position:
        x: 438.203125
        y: 357.66015625
      type: mcp
      connectionId:
        $ref:
          type: connections
          name: FMP
      tools:
        - Fundraisers
        - analyst
        - calendar
        - chart
        - commodity
        - company
        - crypto
        - directory
        - discountedCashFlow
        - economics
        - etfAndMutualFunds
        - forex
        - indexes
        - insiderTrades
        - marketHours
        - marketPerformance
        - news
        - quote
        - search
        - secFilings
        - senate
        - statements
        - technicalIndicators
  bindings:
    - agentNodeId: assistant
      resourceId: mcp_9547656e
  maxSteps: 100
  resumePolicy: safe
---
