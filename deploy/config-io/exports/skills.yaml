  instructions: >
    ---

    name: strategy-library

    description: The StockHarness strategy library. 42 strategy cards, each with how it works, the
    exact signal, the real collections and fields it uses, default parameters, what to explore,
    point-in-time traps and whether it can be backtested today. Use when proposing a theory
    (Theorist), turning a theory into a plugin (Coder), or checking a theory for testability and
    novelty (Judge).

    ---


    # StockHarness Strategy Library


    This skill is the shared map of strategy ideas for the StockHarness research agents.


    - **Theorist:** pick a card, then combine, condition or refine it into a _new, testable_ theory.
    Never resubmit a card unchanged. Check `search_theories` first.

    - **Coder:** use the card's **Signal** and **Data** sections to write the plugin, using the
    field names exactly as listed.

    - **Judge:** use **Status** and **Point-in-time traps** to decide testability and lookahead
    risk.


    Every field name below is real. It exists in the StockHarness workspace today, or it is marked
    _(Layer 2, planned)_ with the collection that will provide it.


    ---


    ## Part 1. Rules that apply to every strategy


    1. **Read only through `ctx.read_df` (plugins) or `query_collection` (exploration).** Both
    filter by `as_of` on the server. Never try to work around them.

    2. **Join on `security_id`, never on the ticker.** Layer 1 rows carry `symbol`. Map them with
    `securities.identifiers` (type `ticker`, using `valid_from`/`valid_to`), or use Layer 2
    collections that already have `security_id`.

    3. **Use the moment the information became known, not the date of the event.**

       | Data                                                                                                             | Known at                                                                                                                                                          |
       | ---------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------- |
       | Daily prices (`prices_daily`)                                                                                    | close of `date` (16:00 ET); trade at the **next** close                                                                                                           |
       | Statements (`income_statement`, `balance_sheet`, `cash_flow`)                                                    | `acceptedDate`. If `acceptedDate[:10] == date` (period end), the value is a placeholder (about 4% of rows): use period end + 45 days (Q1–Q3) or + 90 days (Q4/FY) |
       | Annual metrics without `acceptedDate` (`key_metrics`, `ratios`, `enterprise_values`, `owner_earnings`, segments) | join to the matching `income_statement` row on (`symbol`, `date`) for its `acceptedDate`; otherwise period end + 90 days                                          |
       | Earnings (`earnings_calendar`, legacy `earnings_surprises`)                                                      | report `date`; BMO/AMC timing is unknown, so react at the **next session close**                                                                                  |
       | Dividends (`dividends_history`)                                                                                  | `declarationDate` (empty in about 11% of rows: then use the ex-date `date`, which is conservative)                                                                |
       | Splits (`splits_history`, `corporate_actions`)                                                                   | the day before the ex-date (no announcement date)                                                                                                                 |
       | Insider trades (`insider_trades`)                                                                                | `filingDate` (never `transactionDate`)                                                                                                                            |
       | Congress (`congress_senate`, `congress_house`)                                                                   | `disclosureDate` (never `transactionDate`; the lag is often 30–45 days)                                                                                           |
       | Analyst grades and price targets                                                                                 | `publishedDate`                                                                                                                                                   |
       | Weekly snapshots (`analyst_estimates`, `grades_consensus`, `price_target_consensus`, `financial_scores`)         | `snapshot_date`                                                                                                                                                   |

    4. **Never use "current-only" fields historically.** These hold today's value only and would
    leak the future into a backtest:
       - `company_profiles.*` (sector, industry, beta, marketCap, isActivelyTrading),
       - `shares_float.*`, `price_target_summary.*`, `stock_peers.*`, `key_executives.*`, `market_cap.*`,
       - `universe.*` (its `marketCap`),
       - and `financial_scores`, except from its `snapshot_date` onward.
    5. **Market cap history:** `historical_market_cap` only starts in July 2026. For backtests
    compute `mcap = adj_close × weightedAverageShsOutDil`, using the latest `income_statement` known
    at D.

    6. **Recompute valuation with the price on D.** FMP's `ratios` and `key_metrics` valuation
    fields (`priceToEarningsRatio`, `earningsYield`, `evToEBITDA`, …) use the price at period end.
    Use their accounting inputs, but rebuild the ratios with `adj_close` on D.

    7. **Universe:** use `universe_daily` _(Layer 2, planned)_ once it exists. Until then, include a
    name on D if:
       - it has a `prices_daily` row on D,
       - `adj_close ≥ 5`,
       - its 20-day mean `dollar_volume ≥ $5M`,
       - and its computed `mcap ≥ $2B` (or whatever the theory states).

       Delisted names are included up to their last bar. Delisted coverage is limited to about 100 names, so state the survivorship caveat.

    8. **Sectors:** `securities.sector_history` currently holds a _backfilled current_ sector (see
    H5). Sector-relative results are an approximation; say so.

    9. **Units:** `prices_daily.ret_1d` and `tr_1d` are decimals. Layer 1 fields such as
    `changePercent`, `changesPercentage`, `sector_performance.averageChange` and `dividends_*.yield`
    are in **percent points**. Treasury yields (`ust_10y`, `year10`) are in percent.

    10. **Costs are applied by the evaluator.** Never net them out yourself. Avoid signals that need
    a turnover above about 20× a year unless the theory is about short-term effects.


    ### Status labels


    - **Backtestable now:** at least 5 years of point-in-time history exists today.

    - **After M1 backfill:** the logic is ready, but history is too short until the Layer 1 backfill
    (10y prices, 40q statements, earnings history) completes.

    - **Forward-only:** FMP keeps no history (snapshot or feed data that started in Oct 2026). It
    skips backtesting and is paper-tracked live (Layer 5). The Judge must tag it `forward_only`.

    - **Blocked:** it needs data the current plan doesn't provide.


