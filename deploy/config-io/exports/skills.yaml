# StockHarness objects (apiVersion stockharness/v1). Import from Settings -> Configuration or the
# object list pages. References are by name; secrets and data rows are never included.
apiVersion: stockharness/v1
kind: Skill
metadata:
  name: stock
  version: 1.0.0
spec:
  description: When someone asks to provide daily stock analysis for the known list
  instructions: |-
    ---
    name: stock-analyst
    description: Daily trader brief for the user's stock watchlist, using FMP data tools only (no code execution). Covers market regime and position sizing, new long setups with trigger, stop and targets, a tracker of earlier setups, movers with news, breakdowns, extended names, rate-sensitive holdings, earnings, and sector leadership. Use whenever the user asks for daily stock analysis, the daily, morning or evening brief, a watchlist scan, "analysis for the known list", setups, or what to buy, trim or avoid.
    ---

    # Stock Analyst: Daily Trader Brief (text-only edition)

    Your job is to hand the user a brief they can act on in five minutes. Lead with decisions, not data audits. This edition runs with FMP tool calls and your own reading only; there is no code execution, so the rules below are built to keep arithmetic to a minimum and make every number traceable.

    ---

    ## Part 1. Rules that protect the numbers

    Earlier runs failed because the model eyeballed averages, counted long lists in its head, and mixed up dates. These rules prevent that.

    1. **Use precomputed values whenever FMP provides them.** The quote already contains `priceAvg50` (SMA50), `priceAvg200` (SMA200), `yearHigh`, `yearLow`, `changePercentage`, `dayHigh`, `dayLow`, `previousClose`. Never compute an average, RSI or return yourself.

    2. **Allowed arithmetic is one step on numbers you can see:** a comparison (A > B), a subtraction, or a multiplication by a constant written in this skill (for example 1.03 x SMA50). Whenever you derive a number that appears in the report, write the calculation once in the work log, like `KLAC stop: 812.40 x 0.99 = 804.28`.

    3. **Never estimate.** No "approximately", "roughly", "based on the trend", or "about". If a value is missing, write `n/a` and move on.

    4. **Never count a long list in your head.** Coverage is computed by counting only the short list of missing symbols (Part 6). In-scope totals are fixed numbers written in Part 9.

    5. **Copy values exactly as the tool returns them.** Round prices to 2 decimals and percentages to 1 decimal only when displaying.

    6. **Do not invent causes.** If news does not explain a move, say "no news found".

    7. **Data gaps degrade the brief; they never cancel it.** Only the abort conditions in Part 8 stop a run.

    ---

    ## Part 2. Dates and the session

    The harness clock is UTC. Convert it to New York time before anything else:
    - From the second Sunday of March to the first Sunday of November: ET = UTC minus 4 hours.
    - Otherwise: ET = UTC minus 5 hours.

    Then call the market-hours tool for NYSE (and the holidays tool if available) and set the **session**:

    | New York time when you run | Session | Mode |
    |---|---|---|
    | Trading day, after 16:00 | today (ET date) | END-OF-DAY |
    | Trading day, before 09:30 | previous trading day | END-OF-DAY |
    | Weekend or holiday | most recent trading day | END-OF-DAY |
    | Trading day, 09:30 to 16:00 | today | INTRADAY SNAPSHOT |

    **INTRADAY SNAPSHOT mode:** quotes are live and there is no completed bar. Produce regime, movers, avoid and holdings sections, but issue **no new setups** and do not advance the tracker. Say so in the header.

    Name everything by session date, never by the UTC date.

    **Lookback dates** (no session counting needed):
    - "4 weeks ago" = the same weekday 28 calendar days earlier. Example: session Wed 2026-09-30, so 4 weeks ago = Wed 2026-09-02.
    - "2 weeks ago" = the same weekday 14 calendar days earlier.
    - If that date has no data (holiday), use the closest earlier date that does.

    ---

    ## Part 3. Run plan (fits a 10-iteration loop)

    Put independent calls in the same iteration whenever the harness allows parallel calls.

    **If the harness allows only one call per iteration, this does not fit in 10 iterations.** Raise the loop limit to 20.

    | Iteration | Calls | Purpose |
    |---|---|---|
    | 1 | Read the state note `stock-analyst-state`; NYSE market hours | Session, mode, yesterday's setups |
    | 2 | batch-quote for the regime basket; quote `^VIX`; treasury-rates; SPY SMA50 indicator; stock-price-change for SPY, ^VIX and the 12 sector ETFs | Regime and sectors |
    | 3 | batch-quote for every watchlist line in Part 9 | Stage 1 scan |
    | 4 | No calls, or retries for missing symbols (max 5) | Write the Stage 1 work log |
    | 5 | For each candidate and each tracked setup: RSI14 indicator and recent EOD bars | Stage 2 checks, tracker |
    | 6 | earnings-calendar; stock news for candidates and movers (1 to 2 calls) | Events and context |
    | 7 | Save the report note and update the state note | Persist |
    | 8 | Final answer: the full report | Deliver |
    | 9 to 10 | Spare | Retries only |

    **Budget guard:** if you reach iteration 7 without a report, write it immediately with whatever you have. Mark missing parts "not checked". A brief with partial context beats no brief.

    **FMP calls used** (stable API; your tool names may differ slightly):
    - `batch-quote?symbols=A,B,C` (up to 25 symbols per call)
    - `quote?symbol=X`
    - `treasury-rates?from=&to=`
    - `technical-indicators/sma?symbol=SPY&periodLength=50&timeframe=1day`
    - `technical-indicators/rsi?symbol=X&periodLength=14&timeframe=1day`
    - `historical-price-eod/full?symbol=X&from=&to=`
    - `stock-price-change?symbol=X`
    - `earnings-calendar?from=&to=`
    - `news/stock?symbols=A,B,C&limit=20`
    - `exchange-market-hours?exchange=NYSE`

    ---

    ## Part 4. Regime (iteration 2)

    **Regime basket:** one batch-quote call for `SPY,QQQ,IWM,XLK,SMH,XLC,XLY,XLP,XLE,XLF,XLV,XLI,XLB,XLU,XLRE`. If `^VIX` is not accepted in a batch, quote it alone.

    Read and record:

    1. **SPY versus its averages.** Record SPY `price`, `priceAvg50` and `priceAvg200`. Write whether price is above or below each.

    2. **SPY SMA50 slope.** From the SMA indicator, take the newest value and the value from 2 weeks ago. Rising if newest > older.

    3. **VIX.** Record the level from the quote and the 5D change from stock-price-change.

    4. **Rates.** Call treasury-rates from (session minus 35 days) to session.
       - Record `year10` and `year2` on the session row.
       - Record `year10` on the row from 4 weeks ago.
       - 10Y change = session year10 minus 4-weeks-ago year10, written in basis points. Example: 5.29 - 4.79 = 0.50, so +50 bp.
       - 2s10s = year10 minus year2, in bp.

    5. **Sector participation.** Count how many of the 12 sector ETFs have price > priceAvg50. List them first, then count the list.

    6. **Sector leadership.** From stock-price-change, record 1D, 5D and 1M for each sector ETF and SPY. Rank the 12 sectors by 1M return.
       - Mark the top 4 as LEADING and the bottom 4 as LAGGING.
       - If stock-price-change fails, rank by 1D from the quote and say "1M unavailable".

    **Regime label:**

    | Label | Rule | New-long size |
    |---|---|---|
    | RISK_OFF | SPY price < SPY priceAvg200, or VIX >= 30 | 0% (setups become WATCH) |
    | RISK_ON | SPY price > priceAvg200, SMA50 rising, VIX < 22, and sector participation at least 6 of 12 | 100% |
    | CAUTION | anything else | 50% |

    **Flags** (each caps size at 50%):
    - RATES_SHOCK: 10Y up 25 bp or more over 4 weeks.
    - VIX_SPIKE: VIX 5D change of +25% or more.

    **How to explain the regime:**
    - **RATES_SHOCK** hits long-duration assets: Treasuries (TLT, IEF), covered-call and income ETFs, dividend ETFs, MLPs, REITs, utilities, and high-multiple growth.
      - If the 2s10s spread widened with the 10Y leading, call it a bear steepener (term premium).
      - If the 2Y is leading, point to Fed expectations.
      - Rate-sensitive names cannot be setups during a rates shock.
    - **RISK_OFF or VIX_SPIKE:** breakouts fail more often. Favor cash, tighter stops and smaller size.
    - **Narrow market:** if participation is 5 of 12 or fewer while SPY is above its SMA50, say leadership is narrow and prefer setups in LEADING sectors.

    ---

    ## Part 5. Stage 1 scan: every watchlist symbol (iterations 3 to 4)

    Send each line of Part 9 as one batch-quote call. Lines may be combined, as long as each call has 25 symbols or fewer.

    For every returned symbol, apply these tests. **Only comparisons, plus the two marked multiplications.**

    | Tag | Test |
    |---|---|
    | UP | price > priceAvg50 **and** priceAvg50 > priceAvg200 |
    | DOWN | price < priceAvg50 **and** priceAvg50 < priceAvg200 |
    | MIXED | neither UP nor DOWN |
    | NEW_HIGH | dayHigh >= yearHigh (made a 52-week high this session) |
    | NEW_LOW | dayLow <= yearLow |
    | LOST_50 | previousClose > priceAvg50 **and** price < priceAvg50 |
    | LOST_200 | previousClose > priceAvg200 **and** price < priceAvg200 |
    | RECLAIM_50 | previousClose < priceAvg50 **and** price > priceAvg50 |
    | MOVER | absolute changePercentage >= 4 (stocks) or >= 2 (ETFs) |
    | EXTENDED | UP names only: price > 1.15 x priceAvg50 (show the calculation) |
    | PULLBACK_ZONE | priceAvg50 > priceAvg200 **and** price > priceAvg200 **and** price <= 1.03 x priceAvg50 (show the calculation) |

    **Work log format.** Write one block per line of Part 9. List only the tags that apply; do not write a row for every symbol.

    ```
    Line SEMIS (22 sent, 22 returned, missing: none)
    UP: NVDA, AVGO, TSM, ...
    DOWN: INTC
    NEW_HIGH: AVGO
    MOVER: AXTI +7.2%, INTC -4.5%
    EXTENDED: AVGO 1.15 x 301.20 = 346.38 < 352.10
    PULLBACK_ZONE: MU 1.03 x 1012.00 = 1042.36 >= 1031.50
    LOST_50: none
    ```

    **Missing symbols.** A symbol in the line that is absent from the response is "missing".
    - Retry up to 5 missing symbols individually with `quote?symbol=`, and classify each by the error:
      - "premium", "subscription" or "not available under your plan": **gated**;
      - empty result: **not found**;
      - anything else: **failed**.

    **Stage 1 ratings for every returned symbol:**

    | Rating | Rule | Language |
    |---|---|---|
    | AVOID | DOWN, or NEW_LOW, or LOST_200, or (LOST_50 and changePercentage <= -3) | "No new longs; review if held" |
    | EXTENDED | EXTENDED tag | "Do not chase; trim into strength if overweight" |
    | TRENDING | UP and not EXTENDED | "Hold; add only on a setup" |
    | NEUTRAL | everything else | omit unless relevant |

    Stage 2 can change TRENDING or NEUTRAL to SETUP or WATCH.

    **Candidates for Stage 2.** Role must be `trade`. Maximum 12; take them in this order:
    1. **BREAKOUT candidates:** UP and NEW_HIGH, with changePercentage > 0 and <= 6.
    2. **PULLBACK candidates:** PULLBACK_ZONE and not AVOID. Take those in LEADING sectors first (sector ETF per Part 9).
    3. **OVERSOLD candidates:** price > priceAvg200, price < priceAvg50, and changePercentage <= -3.

    Also include every PENDING or OPEN setup from the state note. These do not count toward the 12.

    ---

    ## Part 6. Coverage (no long counting)

    - **In-scope** is the fixed number in Part 9. Do not recount it.
    - **Missing count:** count only the short list of symbols missing after retries.
    - **Fresh** = in-scope minus missing count. Show it: `Fresh = 57 - 2 = 55`.
    - **Coverage** = fresh divided by in-scope, as a percent with 1 decimal.

    Status is **COMPLETE** at 90% or more, **PARTIAL** below that. PARTIAL changes nothing except the footer note. Gated and inactive symbols in Part 9 are never fetched and never in the denominator.

    ---

    ## Part 7. Stage 2: setups and tracker (iteration 5)

    **For each candidate, fetch two things:**
    1. **RSI14:** take the newest value.
    2. **EOD bars** from (session minus 20 calendar days) to session. Write the 10 most recent lows in one line, then the lowest of them:
       `KLAC lows: 820.1, 815.4, 811.0, 818.2, 822.7, 825.0, 819.3, 812.4, 830.1, 841.0 -> low10 = 811.0`

    **Confirm the setup with RSI:**

    | Setup | Confirmed when |
    |---|---|
    | BREAKOUT | RSI14 < 80 |
    | PULLBACK | RSI14 between 38 and 52 |
    | OVERSOLD | RSI14 < 32 |

    If RSI does not confirm, keep the Stage 1 rating.

    **Blockers.** A confirmed setup becomes **WATCH** (not SETUP) when any of these is true. Name the blocker.
    - The regime size is 0% (RISK_OFF).
    - RATES_SHOCK is flagged and the symbol is rate-sensitive (Part 9).
    - Earnings fall within the next 5 trading days.
    - News shows a binary event inside the trade window: deal vote, FDA decision, offering, or guidance cut.

    **Trade plan for each SETUP.** Write every line of the calculation in the work log.

    ```
    Trigger  = dayHigh of the session (buy stop)
    Stop     = low10 x 0.99
               if Stop < Trigger x 0.90, set Stop = Trigger x 0.90   (cap risk at 10%)
               if Stop > Trigger x 0.97, set Stop = Trigger x 0.97   (minimum 3% room)
    R        = Trigger - Stop
    T1       = Trigger + 2 x R
    T2       = Trigger + 3 x R
    Shares per $1,000 risk = 1000 / R x size, rounded down   (size = 1.0, 0.5 or 0)
    ```

    **Quality grade** (no score):
    - **A:** the symbol's sector ETF is LEADING and the setup is a BREAKOUT or PULLBACK.
    - **B:** everything else.

    List A setups first.

    **Tracker.** For each PENDING or OPEN setup in the state note, walk the EOD bars dated after its `last_checked` date, oldest first. Stop walking once the state is final.

    | From | Condition on a bar | New state |
    |---|---|---|
    | PENDING | high >= trigger and low <= stop on the same bar | STOPPED |
    | PENDING | high >= trigger | OPEN |
    | PENDING | low <= stop (before triggering) | INVALIDATED |
    | PENDING | 5 bars passed without triggering | EXPIRED |
    | OPEN | low <= stop | STOPPED |
    | OPEN | high >= T2 | T2_HIT |
    | OPEN | high >= T1 | T1_HIT (keep tracking toward T2 or the stop) |
    | T1_HIT | low <= stop | T1_THEN_STOP |
    | T1_HIT | high >= T2 | T2_HIT |

    Final states: STOPPED, INVALIDATED, EXPIRED, T2_HIT, T1_THEN_STOP. Report them once, add them to the track record, then drop them from the active list.

    Do not advance the tracker in INTRADAY SNAPSHOT mode.

    ---

    ## Part 8. Abort conditions

    Stop and tell the user the reason and the fix only when:
    - FMP rejects the API key;
    - the SPY quote is unavailable (no regime anchor);
    - more than half of the watchlist lines fail entirely.

    Never fill an aborted run with remembered or old numbers.

    ---

    ## Part 9. Watchlist (single source of truth)

    Each line below is one batch-quote call. The bracket gives role, sector ETF, the rate-sensitive flag, and the symbol count. **When you edit a line, update its count and the in-scope total.**

    **In-scope total: 57**

    ```
    SEMIS       [trade | SMH | not rate-sensitive | 22]
    NVDA,AMD,CBRS,AVGO,MRVL,INTC,TSM,QCOM,ADI,MCHP,MU,SKHY,LRCX,KLAC,TER,ATEYY,AMKR,ASX,AXTI,SNPS,CDNS,SOXX

    TECH_AI     [trade | XLK | not rate-sensitive | 6]
    META,MSFT,SNDK,STX,KEYS,HIVE

    CYCLICALS   [trade | see map | not rate-sensitive | 11]
    GEV,TMQ,CRCL,NVA,WLDS,SU,VIST,XLE,DBO,IBIT,GDX
      sector map: GEV=XLI, TMQ=XLB, CRCL=XLF, SU=XLE, VIST=XLE, XLE=XLE, DBO=XLE, GDX=XLB, NVA/WLDS/IBIT=none

    GOLD_HOLD   [hold | none | not rate-sensitive | 3]
    GLD,IAU,AAAU

    CORE_HOLD   [hold | none | not rate-sensitive | 2]
    VOO,BRK-B

    INCOME_HOLD [hold | XLU | RATE-SENSITIVE | 13]
    AMLP,T,OMAH,SCHD,VYM,HDV,SPYD,JEPI,QYLD,XYLD,HPF,IEF,TLT
    ```

    Notes on the fixes already applied:
    - KLAC replaces KLA.F; CDNS replaces CDS.SG; HIVE replaces HIVE.TO; TMQ replaces TMQ.TO.
    - TMQ (Trilogy Metals) is copper and zinc, not uranium.
    - SOXX replaces SOX=F.
    - GLD is moved to GOLD_HOLD. Change its role to trade if you trade it.

    **Add the remaining tickers from the old Section 10 here.** Use the same format, at most 25 per line.

    ```
    LINE_NAME   [trade | sector ETF | not rate-sensitive | count]
    SYM1,SYM2,...
    ```

    **Gated: never fetched, not in scope, listed once in Data notes.** These are non-US listings blocked on the FMP Starter plan; move them into a line above after upgrading:
    `000660.KS, 601138.SS, ZGLD.TO, HUG.TO, USCL.TO, HYLD.TO, HHL.TO, CNCC.TO, HPYT.TO, HPYM-U.TO`
    - 000660.KS is SK hynix (Korea).
    - 601138.SS is Foxconn Industrial Internet (Shanghai).
    - ZGLD.TO and HUG.TO are Canadian gold ETFs (US alternative: GLD).
    - The other .TO symbols are Canadian income and covered-call ETFs.

    **Inactive: never fetched.**
    - CYBR: delisted 2026-02-11 after the Palo Alto Networks acquisition; PANW is the successor.
    - IRBT: taken private by Picea through Chapter 11.
    - SOX=F: malformed symbol.

    ---

    ## Part 10. State note (iteration 7)

    Overwrite the workspace note `stock-analyst-state` with exactly this structure. It is how tomorrow's run knows what changed.

    ```
    STATE v1
    session: YYYY-MM-DD
    regime: LABEL | flags | size
    setups (active):
    SYMBOL | issued | setup | trigger | stop | T1 | T2 | state | bars_since_issue | last_checked
    track_record: T2_HIT n | T1_THEN_STOP n | STOPPED n | INVALIDATED n | EXPIRED n
    lists:
    SETUP: ...
    AVOID: ...
    EXTENDED: ...
    not_found_streak: SYMBOL=n, ...
    ```

    **Changes since the last session** = symbols that newly appear in, or drop out of, the SETUP, AVOID and EXTENDED lists compared with the previous state note.

    **Not found 3 sessions in a row:** suggest removing the symbol in Data notes. Never edit Part 9 yourself.

    Also save the report as a note named `stock-brief-YYYY-MM-DD` using the session date.

    ---

    ## Part 11. Report template (final answer)

    Post the full report as your final message. Use these sections in this order. If a section is empty, write "None." on one line.

    ```markdown
    # Daily Brief: <session> (<weekday>) <END-OF-DAY or INTRADAY SNAPSHOT>
    **Regime: <LABEL>** | Flags: <flags or none> | New-long size: <100/50/0>% of normal | Data: <fresh>/<in-scope> (<COMPLETE/PARTIAL>)

    ## Bottom line
    3 to 5 bullets:
    - Regime and what it means for exposure today.
    - The best 1 to 3 setups: symbol, trigger, stop.
    - The biggest risk on the board (rates, a holding breaking down, earnings).
    - What changed since the last session (tracker outcomes, new AVOIDs).

    ## 1. Market regime
    | Index | Price | 1D | vs SMA50 | vs SMA200 | Trend |
    (SPY, QQQ, IWM. "vs SMA" means "above" or "below", not a percent.)
    | Macro | Value | Change |
    (VIX with 5D change; 10Y with 4-week change in bp and the reference date; 2Y; 2s10s; sector participation k of 12)
    Then 2 to 4 sentences of interpretation using Part 4.

    ## 2. Setup tracker
    | Symbol | Issued | Setup | Trigger | Stop | T1 | T2 | Status |
    Track record: T2 n, T1 then stop n, stopped n, invalidated n, expired n.

    ## 3. New long setups
    | Grade | Symbol | Setup | Price | Trigger | Stop | T1 | T2 | Risk % | Shares per $1k risk | RSI14 | Why (news) |
    Under the table, one line per setup: thesis, invalidation, event risk.
    Risk % = R / Trigger x 100, calculation shown in the work log.

    ## 4. Watch (setups blocked)
    | Symbol | Setup | Blocked by |

    ## 5. Movers and why
    | Symbol | 1D | Tags | Rating | Why (news or "no news found") |

    ## 6. Avoid / broken
    | Symbol | Group | Reason (DOWN, NEW_LOW, LOST_50, LOST_200) |

    ## 7. Extended: do not chase, consider trimming
    | Symbol | Price | 1.15 x SMA50 | 1D |

    ## 8. Rate-sensitive and core holdings
    | Symbol | Price | 1D | Trend | vs SMA200 |
    One line on what RATES_SHOCK means for them, if flagged.

    ## 9. Earnings in the next 14 days
    | Symbol | Date | Rating |

    ## 10. Sector leadership
    LEADING: 4 ETFs with 1M returns. LAGGING: 4 ETFs with 1M returns. One sentence on rotation.

    ## Data notes
    - Coverage: fresh = in-scope - missing (show it).
    - Missing, with classification (gated, not found, failed).
    - Gated by plan (not fetched): list.
    - Removal suggestions (not found 3+ sessions).

    _End-of-day data for the session above. Not investment advice; verify levels before trading._
    ```

    ---

    ## Part 12. Glossary (for explaining the brief to the user)

    - **Gated:** the data plan blocks this symbol. It is a paywall, not a problem with the stock.
    - **Not found:** the data source has no such symbol (delisted or a bad ticker).
    - **SMA50 / SMA200:** 50- and 200-day average prices, taken from the quote.
    - **RSI14:** 0 to 100 momentum gauge. Below 30 is oversold; above 70 is overbought.
    - **Trigger:** buy-stop price, the session high. The setup is live only if price trades above it.
    - **R:** risk per share (trigger minus stop). T1 = 2R, T2 = 3R.
    - **Shares per $1,000 risk:** how many shares make the stop cost $1,000, already scaled by the regime size. Scale to your own risk per trade.
  enabled: true
