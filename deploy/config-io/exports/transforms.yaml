# StockHarness objects (apiVersion stockharness/v1). Import from Settings -> Configuration or the
# object list pages. References are by name; secrets and data rows are never included.
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: corporate_actions
  version: "1"
spec:
  description: "Splits and dividends keyed to security_id: the rolling calendars merged with the full per-symbol histories; dividends classified cash or special."
  code: |
    import oh
    from pipeline.layer2.corporate_actions import compute

    oh.output("corporate_actions").upsert(compute(lambda c, f=None, cols=None: oh.read(c, f, columns=cols)))
  inputs:
    - securities
    - dividends_calendar
    - dividends_history
    - splits_calendar
    - splits_history
  outputs:
    - collection: corporate_actions
      key:
        - security_id
        - action_type
        - ex_date
      write_mode: upsert
      known_at_field: known_at
      static: false
      description: "One row per split or dividend: action_type (split, cash_dividend, special_dividend), ex_date, split_ratio or dividend_amount."
      grain: security × action × ex-date
      fields:
        security_id:
          description: StockHarness security id
        action_type:
          description: split, cash_dividend or special_dividend
        ex_date:
          description: Ex-date
        record_date:
          description: Record date
        pay_date:
          description: Payment date
        declaration_date:
          description: Declaration date
        dividend_amount:
          description: Cash dividend per share
          unit: USD
        currency:
          description: Dividend currency
        split_ratio:
          description: New shares per old share (4-for-1 = 4.0; 1-for-10 reverse = 0.1)
          unit: ratio
        split_type:
          description: Split type as reported
        known_at:
          description: Declaration date, else the day before the ex-date
        _lineage:
          description: Source collection and row ids
  trigger:
    after:
      - dataset:dividends_calendar
      - dataset:splits_calendar
  incremental:
    mode: full
    lookback_days: 0
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: features_daily
  version: "1"
spec:
  description: "Daily features per security from point-in-time inputs only: price (momentum, 12-1, volatility, 52-week high), valuation, quality and growth from the fundamentals version known that day priced at that day's market cap, and days since the latest filing. Every feature is in the registry (pipeline.layer2.features.REGISTRY) and documented in the catalog."
  code: |
    import oh
    from pipeline.layer2.features import compute_daily, registry_docs

    out = oh.output("features_daily")
    read = lambda c, f=None, cols=None, sort=None: oh.read(c, f, columns=cols, sort=sort)
    for rows in compute_daily(read, oh.window):
        out.upsert(rows)
    oh.describe("features_daily", fields=registry_docs())
  inputs:
    - securities
    - prices_daily
    - universe_daily
    - fundamentals_pit
  outputs:
    - collection: features_daily
      key:
        - security_id
        - date
      write_mode: upsert
      known_at_field: known_at
      as_of_field: as_of_date
      static: false
      description: "One row per security and trading day: price, liquidity, valuation, quality, growth and event features (all as known that day)."
      grain: security × trading day
  trigger:
    after:
      - transform:universe_daily
  incremental:
    mode: date_range
    lookback_days: 260
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: features_ranked
  version: "1"
spec:
  description: "Per date, over that date's universe members: cross-sectional z-scores (clipped at ±3) and percentiles of every feature, value / quality / momentum / growth / low-vol composite scores with sector percentiles, and a composite percentile that averages 0.5 per date."
  code: |
    import oh
    from pipeline.layer2.features import compute_ranked, registry_docs

    out = oh.output("features_ranked")
    read = lambda c, f=None, cols=None, sort=None: oh.read(c, f, columns=cols, sort=sort)
    for rows in compute_ranked(read, oh.window):
        out.upsert(rows)
    oh.describe("features_ranked", fields=registry_docs(ranked=True))
  inputs:
    - features_daily
    - universe_counts
  outputs:
    - collection: features_ranked
      key:
        - security_id
        - date
      write_mode: upsert
      known_at_field: known_at
      as_of_field: as_of_date
      static: false
      description: "One row per universe member and trading day: <feature>_z, <feature>_pct, composite scores and percentiles."
      grain: universe member × trading day
  trigger:
    after:
      - transform:features_daily
  incremental:
    mode: date_range
    lookback_days: 0
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: fundamentals_pit
  version: "1"
spec:
  description: "Quarterly income statement, balance sheet and cash flow merged into point-in-time versions per security: a restatement adds a version (is_latest marks the newest), known_at is the SEC acceptance time, as_of_date the first session after it, and TTM figures are as known then."
  code: |
    import oh
    from pipeline.layer2.fundamentals_pit import compute

    from pipeline.layer2.fundamentals_logic import field_docs

    out = oh.output("fundamentals_pit")
    read = lambda c, f=None, cols=None, sort=None: oh.read(c, f, columns=cols, sort=sort)
    for rows, issues in compute(read):
        out.upsert(rows)
        for i in issues:
            oh.dq(i["issue_type"], i["severity"], security_id=i["security_id"], date=i["date"])
    oh.describe("fundamentals_pit", fields=field_docs())
  inputs:
    - securities
    - trading_calendar
    - income_statement
    - balance_sheet
    - cash_flow
  outputs:
    - collection: fundamentals_pit
      key:
        - security_id
        - period_end
        - version
      write_mode: upsert
      known_at_field: known_at
      as_of_field: as_of_date
      static: false
      description: "One row per security, fiscal quarter and version. Filter as_of_date <= D and take the highest version per period for what was known on D. Values are in the reported currency: is_usd is false for the ~9% non-USD filers (no FX conversion yet)."
      grain: security × fiscal quarter × version
      fields:
        period_end:
          description: Fiscal quarter end date
        version:
          description: 1 = first filing; each later acceptance (restatement) adds one
        is_latest:
          description: The newest version of this period
        known_at:
          description: SEC acceptance time (UTC); date-only acceptances mean the end of that day
        currency:
          description: Reported currency
        is_usd:
          description: Reported in USD (non-USD values are not converted)
        revenue:
          description: Revenue for the quarter
          unit: reported currency
        net_income:
          description: Net income for the quarter
          unit: reported currency
        eps_diluted:
          description: Diluted EPS for the quarter
          unit: reported currency per share
        free_cash_flow:
          description: Operating cash flow minus capex for the quarter
          unit: reported currency
        ttm_revenue:
          description: Sum of the last four consecutive quarters as known at known_at
          unit: reported currency
        ttm_net_income:
          description: Trailing-twelve-month net income as known at known_at
          unit: reported currency
  trigger:
    after:
      - dataset:income_statement
      - dataset:balance_sheet
      - dataset:cash_flow
  incremental:
    mode: full
    lookback_days: 0
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: macro_daily
  version: "1"
spec:
  description: "One row per date: the treasury curve (3m, 2y, 10y, 30y and spreads), VIX, S&P 500 and Nasdaq levels with the S&P daily return, and sector returns."
  code: |
    import oh
    from pipeline.layer2.macro_daily import compute

    oh.output("macro_daily").upsert(compute(lambda c, f=None, cols=None: oh.read(c, f, columns=cols)))
  inputs:
    - treasury_rates
    - eod_index
    - sector_performance
  outputs:
    - collection: macro_daily
      key:
        - date
      write_mode: upsert
      known_at_field: known_at
      as_of_field: as_of_date
      static: false
      description: Market-wide daily context for features and regimes.
      grain: trading day
      fields:
        date:
          description: Trading day
        ust_3m:
          description: 3-month treasury yield
          unit: "%"
        ust_2y:
          description: 2-year treasury yield
          unit: "%"
        ust_10y:
          description: 10-year treasury yield
          unit: "%"
        ust_30y:
          description: 30-year treasury yield
          unit: "%"
        curve_10y_2y:
          description: 10-year minus 2-year yield
          unit: percentage points
        curve_10y_3m:
          description: 10-year minus 3-month yield
          unit: percentage points
        vix:
          description: CBOE VIX close
        spx_close:
          description: S&P 500 close
        ndx_close:
          description: Nasdaq Composite close
        spx_ret_1d:
          description: S&P 500 1-day return
          unit: ratio
        sector_returns:
          description: Sector average change that day, by sector
          unit: "%"
        known_at:
          description: When the row became known (UTC)
        as_of_date:
          description: "First date it may be used: filter as_of_date <= D"
        transform_name:
          description: Producing transform
        transform_version:
          description: Logic version
  trigger:
    after:
      - dataset:treasury_rates
      - dataset:eod_index
  incremental:
    mode: full
    lookback_days: 0
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: prices_daily
  version: "1"
spec:
  description: Split- and dividend-adjusted point-in-time daily prices per security, with 1-day price and total returns and DQ flags. Daily runs load a 10-trading-day lookback and write only the window; a security with a new split gets its history rewritten.
  code: |
    import oh
    from pipeline.layer2.prices_daily import compute

    # H1: a 10-day lookback is loaded, only [start, end] is written. H2: DQ through oh.dq (idempotent).
    # H3: DQ never fails the run; gates on the DQ rate decide.
    out = oh.output("prices_daily")
    read = lambda c, f=None, cols=None, sort=None: oh.read(c, f, columns=cols, sort=sort)
    for rows, issues in compute(read, oh.window):
        out.upsert(rows)
        for i in issues:
            oh.dq(i["issue_type"], i["severity"], security_id=i["security_id"], date=i["date"])
  inputs:
    - securities
    - corporate_actions
    - eod_prices
  outputs:
    - collection: prices_daily
      key:
        - security_id
        - date
      write_mode: upsert
      known_at_field: known_at
      as_of_field: as_of_date
      static: false
      description: "One row per security and trading day: OHLCV, adj_* on the current share basis, ret_1d, tr_1d, dollar_volume, dq_flags."
      grain: security × trading day
      fields:
        security_id:
          description: StockHarness security id
        date:
          description: Trading day
        ticker:
          description: Ticker that traded that day
        open:
          description: Open
          unit: USD
        high:
          description: High
          unit: USD
        low:
          description: Low
          unit: USD
        close:
          description: Close (as traded)
          unit: USD
        volume:
          description: Volume
          unit: shares
        vwap:
          description: VWAP
          unit: USD
        adj_factor:
          description: "Backward split factor: adj_close = close × adj_factor"
          unit: ratio
        adj_open:
          description: Split-adjusted open
          unit: USD
        adj_high:
          description: Split-adjusted high
          unit: USD
        adj_low:
          description: Split-adjusted low
          unit: USD
        adj_close:
          description: Split-adjusted close (current share basis)
          unit: USD
        ret_1d:
          description: Price return versus the previous bar, split-adjusted
          unit: ratio
        tr_1d:
          description: Total return (price + dividend) versus the previous bar
          unit: ratio
        dollar_volume:
          description: close × volume
          unit: USD
        dq_flags:
          description: zero_or_negative_price, high_lt_low, close_outside_range, zero_volume, jump_no_action, stale_price
        known_at:
          description: When the row became known (UTC)
        as_of_date:
          description: "First date it may be used: filter as_of_date <= D"
        source_collection:
          description: Layer 1 input
        source_ids:
          description: eod_prices row ids
        transform_name:
          description: Producing transform
        transform_version:
          description: Logic version
  trigger:
    after:
      - dataset:eod_prices
      - transform:corporate_actions
  incremental:
    mode: date_range
    lookback_days: 10
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: securities
  version: "1"
spec:
  description: "The securities master: one row per security with an immutable security_id, matched by CIK, then CUSIP, then ticker + name. Tickers, sectors, industries and exchanges are validity intervals (ISO dates)."
  code: |
    import oh
    from pipeline.layer2.securities import compute

    # H4 ISO interval bounds, H5 sector_is_backfilled, H6 ticker valid_from = first observed date (#98).
    docs = compute(lambda c, f=None, cols=None: oh.read(c, f, columns=cols), oh.aggregate)
    oh.output("securities").upsert(docs)
  inputs:
    - company_profiles
    - stock_list
    - delisted_companies
    - eod_prices
  outputs:
    - collection: securities
      key:
        - security_id
      write_mode: upsert
      static: true
      description: Security identity and attribute histories. Resolve a ticker on a date through identifiers[type=ticker] valid_from/valid_to.
      grain: security
      fields:
        security_id:
          description: Immutable StockHarness id (SEC_000001); join key for every Layer 2 table
        name:
          description: Company name
        security_type:
          description: common or ADR
        country:
          description: Country of domicile
        currency:
          description: Trading currency
        ipo_date:
          description: IPO date (FMP)
        is_active:
          description: Still listed and actively trading
        delisted_date:
          description: Delisting date (delisted names only)
        identifiers:
          description: ticker / cik / cusip / isin with valid_from and valid_to (ISO dates); a ticker is valid from the first date it was observed
        sector_history:
          description: Sector intervals; the first is backfilled to the first observed date when sector_is_backfilled
        sector_is_backfilled:
          description: The earliest sector interval was backfilled from the current sector, not observed then
        sector_observed_from:
          description: When the sector was first actually observed
        industry_history:
          description: Industry intervals (same rules as sectors)
        industry_is_backfilled:
          description: The earliest industry interval was backfilled
        industry_observed_from:
          description: When the industry was first observed
        exchange_history:
          description: Exchange intervals
        source_collections:
          description: Layer 1 inputs
  trigger:
    after:
      - dataset:company_profiles
  incremental:
    mode: full
    lookback_days: 0
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: trading_calendar
  version: "1"
spec:
  description: NYSE trading sessions from 1990 through the end of next year (open and close in UTC, early closes, previous and next session). Re-built monthly so it always reaches at least 11 months ahead.
  code: |
    import oh
    from pipeline.layer2.trading_calendar import compute

    # NYSE sessions 1990 .. end of next year (exchange_calendars, bounded explicitly: M2, #31).
    oh.output("trading_calendar").upsert(compute())
  inputs: []
  outputs:
    - collection: trading_calendar
      key:
        - date
      write_mode: upsert
      static: true
      description: "One row per NYSE session: date, open_utc, close_utc, is_early_close, prev_trading_day, next_trading_day."
      grain: trading day
      fields:
        date:
          description: Session date (midnight UTC)
        is_trading_day:
          description: Always true (only sessions are stored)
        open_utc:
          description: Market open
          unit: UTC
        close_utc:
          description: Market close (13:00 ET on early closes)
          unit: UTC
        is_early_close:
          description: Half day (close at or before 18:30 UTC)
        prev_trading_day:
          description: Previous session
        next_trading_day:
          description: Next session
  trigger:
    schedule:
      enabled: true
      everyMinutes: 43200
      input: Run the scheduled task.
      at: 05:00
      timezone: UTC
    after: []
  incremental:
    mode: full
    lookback_days: 0
  params: {}
  secrets: []
  enabled: true
---
apiVersion: stockharness/v1
kind: Transform
metadata:
  name: universe_daily
  version: "1"
spec:
  description: "The point-in-time tradeable universe: for every security and priced date, whether it passed the price, liquidity (20-day median dollar volume), market cap (as of that date) and exchange filters. Delisted names count while they were listed. universe_counts publishes the size per date."
  code: |
    import oh
    from pipeline.layer2.universe_daily import compute

    # Thresholds are this transform's params; market cap is reported, else close x shares known on that date.
    read = lambda c, f=None, cols=None, sort=None: oh.read(c, f, columns=cols, sort=sort)
    for name, rows in compute(read, oh.window, oh.params):
        oh.output(name).upsert(rows)
  inputs:
    - securities
    - prices_daily
    - historical_market_cap
    - fundamentals_pit
  outputs:
    - collection: universe_daily
      key:
        - security_id
        - date
      write_mode: upsert
      known_at_field: known_at
      as_of_field: as_of_date
      static: false
      description: One row per security and priced date. Use in_universe = true on date D for the universe as of D (never filter by today's market cap).
      grain: security × trading day
      fields:
        security_id:
          description: StockHarness security id
        date:
          description: Trading day
        in_universe:
          description: Passed every filter on this date
        fails:
          description: "Filters that failed: price, liquidity, market_cap, exchange"
        close:
          description: Close that day
          unit: USD
        adv_20d:
          description: Median dollar volume over the last 20 trading days
          unit: USD
        market_cap:
          description: Market cap on this date
          unit: USD
        market_cap_source:
          description: reported (historical_market_cap) or estimated (close × shares outstanding as known then)
        exchange:
          description: Exchange as of this date (securities.exchange_history)
        known_at:
          description: When the row became known (UTC)
        as_of_date:
          description: "First date it may be used: filter as_of_date <= D"
    - collection: universe_counts
      key:
        - date
      write_mode: upsert
      known_at_field: known_at
      as_of_field: as_of_date
      static: false
      description: "Universe size per date: members and priced securities."
      grain: trading day
      fields:
        date:
          description: Trading day
        members:
          description: Securities in the universe on this date
        priced:
          description: Securities with a price on this date
        known_at:
          description: When the row became known (UTC)
        as_of_date:
          description: "First date it may be used: filter as_of_date <= D"
  trigger:
    after:
      - transform:prices_daily
  incremental:
    mode: date_range
    lookback_days: 30
  params:
    min_price: 5
    min_adv_20d: 1000000
    min_market_cap: 300000000
    exchanges:
      - NASDAQ
      - NYSE
      - AMEX
      - NYSE American
  secrets: []
  enabled: true
