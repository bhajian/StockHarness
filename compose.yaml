# Existing installations keep their original project (and so their volumes) through COMPOSE_PROJECT_NAME in .env.
name: openharness

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 8088
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
  MONGODB_URI: mongodb://agentic:${MONGO_PASSWORD:?Run ./start.sh first}@mongo:27017/agentic?authSource=admin
  MONGODB_DATABASE: agentic
  RABBITMQ_URL: amqp://agentic:${RABBITMQ_PASSWORD:?Run ./start.sh first}@rabbitmq:5672
  WEAVIATE_URL: http://weaviate:8080
  WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?Run ./start.sh first}
  VECTOR_STORE: weaviate
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run ./start.sh first}
  SETUP_TOKEN: ${SETUP_TOKEN:?Run ./start.sh first}
  DATA_DIR: /data
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  MAX_ACTIVE_RUNS: ${MAX_ACTIVE_RUNS:-20}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
  ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
  ALLOWED_PRIVATE_HOSTS: ${ALLOWED_PRIVATE_HOSTS:-host.docker.internal,ollama}
  TRUST_PROXY: ${TRUST_PROXY:-0}
  # MongoDB collections: the internal MongoDB MCP server. The API provisions its least-privilege database user.
  MONGODB_MCP_URL: http://mongodb-mcp:3000/mcp
  MONGODB_MCP_TOKEN: ${MONGODB_MCP_TOKEN:?Run ./start.sh --configure-only to add MongoDB MCP credentials to .env}
  MONGODB_MCP_PASSWORD: ${MONGODB_MCP_PASSWORD:?Run ./start.sh --configure-only to add MongoDB MCP credentials to .env}
  # Python executor: agent-written code runs in the python-executor service (one child process per job).
  EXECUTOR_BACKEND: service
  EXECUTOR_URL: http://python-executor:7000
  EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?Run ./start.sh --configure-only to add the Python executor token to .env}
  EXECUTOR_CALLBACK_URL: http://api:8088
  EXECUTOR_MAX_PARALLEL: ${EXECUTOR_MAX_PARALLEL:-16}

services:
  storage-init:
    image: alpine:3.22
    user: root
    command:
      ['sh', '-c', 'mkdir -p /data/files && chown 1000:1000 /data /data/files && chmod 700 /data/files']
    volumes: ['files:/data']
    restart: 'no'

  api:
    build: .
    image: openharness:local
    init: true
    environment: *app-environment
    ports: ['${STUDIO_BIND:-127.0.0.1}:${STUDIO_PORT:-8088}:8088']
    # storage-init prepares the volume; skipping Docker's copy-up avoids a race when both services start at once.
    volumes: ['files:/data:nocopy']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      storage-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      weaviate: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  runner:
    image: openharness:local
    pull_policy: never
    command: ['node', 'dist/apps/runner/src/worker.js']
    init: true
    environment: *app-environment
    volumes: ['files:/data:nocopy']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      storage-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      weaviate: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/openharness-worker-heartbeat','utf8'))<20000?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: agentic
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run ./start.sh first}
    volumes: ['mongodb:/data/db']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username agentic --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval ''quit(db.adminCommand({ping:1}).ok ? 0 : 1)'' >/dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # The official MongoDB MCP server over the stack MongoDB. Internal only: no published port, bearer token required,
  # and its user can only reach workspace databases that OpenHarness grants.
  mongodb-mcp:
    build: { context: ., dockerfile: mongodb-mcp/Dockerfile }
    image: openharness-mongodb-mcp:local
    init: true
    environment:
      MDB_MCP_CONNECTION_STRING: mongodb://openharness_mcp:${MONGODB_MCP_PASSWORD:?Run ./start.sh --configure-only to add MongoDB MCP credentials to .env}@mongo:27017/?authSource=admin
      MDB_MCP_HTTP_HEADERS: '{"authorization":"Bearer ${MONGODB_MCP_TOKEN:?Run ./start.sh --configure-only to add MongoDB MCP credentials to .env}"}'
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]

  # Python 3.12 with the data and trading libraries agent code may use. Internal only: the API starts jobs with a
  # bearer token; each job fetches its code from the API and reaches MongoDB with its workspace's own user.
  python-executor:
    build: { context: ., dockerfile: python-executor/Dockerfile }
    image: openharness-python-executor:local
    init: true
    environment:
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?Run ./start.sh --configure-only to add the Python executor token to .env}
      EXECUTOR_MAX_JOBS: ${EXECUTOR_MAX_PARALLEL:-16}
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp', '/work:uid=1000,gid=1000,mode=0700']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7000/health', timeout=5).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: agentic
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run ./start.sh first}
      # A run is acknowledged when it ends. The broker's default 30-minute consumer timeout would close the
      # channel under long runs; 30 days leaves that to the runners' own time limits.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit consumer_timeout 2592000000
    volumes: ['rabbitmq:/var/lib/rabbitmq']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.6
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?Run ./start.sh first}
      AUTHENTICATION_APIKEY_USERS: agentic
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'
      AUTHORIZATION_ADMINLIST_USERS: agentic
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: 'true'
      AUTOSCHEMA_ENABLED: 'false'
      LIMIT_RESOURCES: 'true'
      GOMEMLIMIT: 512MiB
    volumes: ['weaviate:/var/lib/weaviate']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/v1/.well-known/ready']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  mongodb:
  rabbitmq:
  weaviate:
  files:
